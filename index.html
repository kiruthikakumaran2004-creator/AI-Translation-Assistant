<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Translation Assistant</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef2ff;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 650px;
      margin: 35px auto;
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 4px 18px #ccd2e0;
    }
    h1 { color: #4338ca; text-align: center; }
    p { text-align: center; color: #555; }
    textarea, select, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 16px;
    }
    textarea { height: 140px; border: 1px solid #bbb; }
    select { border: 1px solid #bbb; background: white; }
    button {
      background: #4f46e5;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; }
    #output {
      background: #f0fdf4;
      padding: 15px;
      border-radius: 8px;
      min-height: 45px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .note { font-size: 13px; }
  </style>
</head>
<body>
  <main class="container">
    <h1>🌐 AI Translation Assistant</h1>
    <p>Translate text from one language to another</p>

    <label for="source">Enter your text</label>
    <textarea id="source" placeholder="Type your text here..."></textarea>

    <label for="language">Translate into</label>
    <select id="language">
      <option value="Tamil">Tamil</option>
      <option value="English">English</option>
      <option value="Hindi">Hindi</option>
      <option value="Malayalam">Malayalam</option>
      <option value="Telugu">Telugu</option>
      <option value="Kannada">Kannada</option>
      <option value="French">French</option>
      <option value="Spanish">Spanish</option>
    </select>

    <button id="translate" onclick="translateText()">Translate Text</button>

    <h3>Translation Output</h3>
    <div id="output">Your translation will appear here.</div>
    <button onclick="copyOutput()">Copy Translation</button>

    <p class="note">Mini Project: AI Translation Assistant</p>
  </main>

  <script>
    async function translateText() {
      const source = document.getElementById("source").value.trim();
      const language = document.getElementById("language").value;
      const output = document.getElementById("output");
      const button = document.getElementById("translate");

      if (!source) {
        output.textContent = "Please enter some text first.";
        return;
      }

      const prompt = `Translate the following text into ${language}.
Return only the translation, without explanations:\n\n${source}`;

      output.textContent = "Translating...";
      button.disabled = true;

      try {
        const response = await fetch(
          "https://api.mymemory.translated.net/get?q=" +
          encodeURIComponent(source) +
          "&langpair=auto|" +
          encodeURIComponent(
            {"Tamil":"ta","English":"en","Hindi":"hi",
             "Malayalam":"ml","Telugu":"te","Kannada":"kn",
             "French":"fr","Spanish":"es"}[language]
          )
        );

        if (!response.ok) throw new Error("Translation service unavailable");

        const data = await response.json();
        if (data.responseStatus !== 200 || !data.responseData?.translatedText) {
          throw new Error("No translation returned");
        }

        output.textContent = data.responseData.translatedText;
      } catch (error) {
        output.textContent =
          "Translation failed. Please check your internet connection and try again.";
      } finally {
        button.disabled = false;
      }
    }

    function copyOutput() {
      const text = document.getElementById("output").textContent;
      navigator.clipboard.writeText(text)
        .then(() => alert("Translation copied!"))
        .catch(() => alert("Please select and copy the translation manually."));
    }
  </script>
</body>
</html>
